<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户消息中心 - 智能客服</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    .logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 12px;
    }
    .logo h1 { font-size: 24px; color: #1d1d1f; }
    .logo p { font-size: 14px; color: #86868b; margin-top: 4px; }
    
    .login-form {
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    
    .divider {
      text-align: center;
      margin: 20px 0;
      color: #86868b;
      font-size: 14px;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #ddd;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    
    .guest-link {
      text-align: center;
      font-size: 14px;
      color: #0071e3;
      cursor: pointer;
    }
    
    /* 消息列表 */
    .messages-container {
      display: none;
    }
    .messages-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
    }
    .messages-title {
      font-size: 18px;
      font-weight: 600;
    }
    .logout-btn {
      padding: 8px 16px;
      background: #f5f5f7;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    
    .message-card {
      background: #f5f5f7;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .message-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #86868b;
      margin-bottom: 8px;
    }
    .message-status {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-resolved { background: #d1fae5; color: #065f46; }
    
    .message-content {
      font-size: 14px;
      line-height: 1.6;
      color: #333;
    }
    
    .continue-btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #86868b;
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 登录界面 -->
    <div id="login-screen">
      <div class="logo">
        <div class="logo-icon">💬</div>
        <h1>客户消息中心</h1>
        <p>查看您的客服对话记录</p>
      </div>
      
      <div class="login-form">
        <div class="form-group">
          <label>您的手机号或订单号</label>
          <input type="text" id="user-id" placeholder="请输入手机号或订单号">
        </div>
        <button class="btn" onclick="login()">查看消息</button>
      </div>
      
      <div class="divider">或</div>
      
      <div class="guest-link" onclick="guestLogin()">以访客身份查看（演示模式）</div>
    </div>
    
    <!-- 消息列表 -->
    <div id="messages-screen" class="messages-container">
      <div class="messages-header">
        <div class="messages-title">我的消息</div>
        <button class="logout-btn" onclick="logout()">退出</button>
      </div>
      
      <div id="messages-list"></div>
    </div>
  </div>
  
  <script>
    let currentUser = null;
    
    // 登录
    function login() {
      const userId = document.getElementById('user-id').value.trim();
      if (!userId) {
        alert('请输入手机号或订单号');
        return;
      }
      
      currentUser = userId;
      localStorage.setItem('cs_current_user', userId);
      showMessages();
    }
    
    // 访客登录
    function guestLogin() {
      currentUser = 'guest_' + Date.now();
      localStorage.setItem('cs_current_user', currentUser);
      showMessages();
    }
    
    // 显示消息
    function showMessages() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('messages-screen').style.display = 'block';
      
      renderMessages();
    }
    
    // 渲染消息列表
    function renderMessages() {
      const allConversations = JSON.parse(localStorage.getItem('cs_conversations') || '[]');
      const userConversations = allConversations.filter(c => c.userId === currentUser);
      
      const list = document.getElementById('messages-list');
      
      if (userConversations.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <p>暂无对话记录</p>
          </div>
        `;
        return;
      }
      
      list.innerHTML = userConversations.slice().reverse().map(conv => `
        <div class="message-card">
          <div class="message-meta">
            <span>${new Date(conv.createdAt).toLocaleString('zh-CN')}</span>
            <span class="message-status ${conv.status === 'resolved' ? 'status-resolved' : 'status-pending'}">
              ${conv.status === 'resolved' ? '✅ 已解决' : '⏳ 处理中'}
            </span>
          </div>
          <div class="message-content">
            <strong>您的问题：</strong>${conv.firstMessage}<br>
            <strong>客服回复：</strong>${conv.lastReply || '等待客服回复...'}
          </div>
          <button class="continue-btn" onclick="continueChat('${conv.id}')">继续对话</button>
        </div>
      `).join('');
    }
    
    // 继续对话
    function continueChat(convId) {
      // 跳转到客服聊天页面
      window.open('chat.html?convId=' + convId, '_blank');
    }
    
    // 退出
    function logout() {
      currentUser = null;
      localStorage.removeItem('cs_current_user');
      document.getElementById('login-screen').style.display = 'block';
      document.getElementById('messages-screen').style.display = 'none';
    }
    
    // 检查是否已登录
    window.onload = function() {
      const savedUser = localStorage.getItem('cs_current_user');
      if (savedUser) {
        currentUser = savedUser;
        showMessages();
      }
    };
  </script>
</body>
</html>
