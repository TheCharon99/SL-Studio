<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能客服系统 - AI Agent Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* 顶部导航 */
    .header {
      background: #fff;
      padding: 16px 24px;
      border-bottom: 1px solid #e5e5e7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo {
      font-size: 20px;
      font-weight: 600;
      color: #1d1d1f;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
    }
    
    .header-actions {
      display: flex;
      gap: 12px;
    }
    
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #0071e3;
      color: #fff;
    }
    
    .btn-primary:hover {
      background: #0077ed;
    }
    
    .btn-secondary {
      background: #f5f5f7;
      color: #1d1d1f;
    }
    
    .btn-secondary:hover {
      background: #e8e8ed;
    }
    
    /* 主内容区 */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    /* 左侧面板 */
    .sidebar {
      width: 280px;
      background: #fff;
      border-right: 1px solid #e5e5e7;
      display: flex;
      flex-direction: column;
    }
    
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #e5e5e7;
    }
    
    .new-chat-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    
    .chat-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.2s;
    }
    
    .chat-item:hover {
      background: #f5f5f7;
    }
    
    .chat-item.active {
      background: #e8f0fe;
    }
    
    .chat-item-title {
      font-size: 14px;
      font-weight: 500;
      color: #1d1d1f;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .chat-item-meta {
      font-size: 12px;
      color: #86868b;
    }
    
    /* 右侧聊天区 */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f5f5f7;
    }
    
    .chat-header {
      background: #fff;
      padding: 16px 24px;
      border-bottom: 1px solid #e5e5e7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .chat-title {
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
    }
    
    .chat-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #34c759;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      background: #34c759;
      border-radius: 50%;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .message {
      max-width: 70%;
      display: flex;
      gap: 12px;
    }
    
    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    
    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    
    .message.assistant .message-avatar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    
    .message.user .message-avatar {
      background: #0071e3;
      color: #fff;
    }
    
    .message-content {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    
    .message.assistant .message-content {
      background: #fff;
      color: #1d1d1f;
      border-bottom-left-radius: 4px;
    }
    
    .message.user .message-content {
      background: #0071e3;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    
    .message-tools {
      margin-top: 8px;
      padding: 8px 12px;
      background: #f5f5f7;
      border-radius: 8px;
      font-size: 12px;
      color: #86868b;
    }
    
    .tool-call {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: #e8f0fe;
      border-radius: 4px;
      font-size: 11px;
      color: #0071e3;
      margin-right: 4px;
      margin-bottom: 4px;
    }
    
    .chat-input {
      background: #fff;
      padding: 16px 24px;
      border-top: 1px solid #e5e5e7;
    }
    
    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    
    .input-box {
      flex: 1;
      background: #f5f5f7;
      border-radius: 12px;
      padding: 12px 16px;
      max-height: 120px;
      overflow-y: auto;
    }
    
    .input-box textarea {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
      font-family: inherit;
    }
    
    .input-box textarea::placeholder {
      color: #86868b;
    }
    
    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #0071e3;
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: background 0.2s;
    }
    
    .send-btn:hover {
      background: #0077ed;
    }
    
    .send-btn:disabled {
      background: #d2d2d7;
      cursor: not-allowed;
    }
    
    /* 右侧面板 */
    .info-panel {
      width: 300px;
      background: #fff;
      border-left: 1px solid #e5e5e7;
      padding: 24px;
      overflow-y: auto;
    }
    
    .panel-section {
      margin-bottom: 24px;
    }
    
    .panel-title {
      font-size: 12px;
      font-weight: 600;
      color: #86868b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    
    .faq-item {
      padding: 12px;
      background: #f5f5f7;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .faq-item:hover {
      background: #e8e8ed;
    }
    
    .faq-question {
      font-size: 13px;
      font-weight: 500;
      color: #1d1d1f;
      margin-bottom: 4px;
    }
    
    .faq-answer {
      font-size: 12px;
      color: #86868b;
      line-height: 1.4;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    
    .stat-card {
      padding: 16px;
      background: #f5f5f7;
      border-radius: 12px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: 600;
      color: #0071e3;
    }
    
    .stat-label {
      font-size: 11px;
      color: #86868b;
      margin-top: 4px;
    }
    
    /* 欢迎界面 */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }
    
    .welcome-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #fff;
      margin-bottom: 24px;
    }
    
    .welcome-title {
      font-size: 28px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 12px;
    }
    
    .welcome-subtitle {
      font-size: 16px;
      color: #86868b;
      margin-bottom: 32px;
      max-width: 400px;
    }
    
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      max-width: 600px;
    }
    
    .quick-action {
      padding: 12px 20px;
      background: #fff;
      border: 1px solid #e5e5e7;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      color: #1d1d1f;
      transition: all 0.2s;
    }
    
    .quick-action:hover {
      background: #f5f5f7;
      border-color: #0071e3;
      color: #0071e3;
    }
    
    /* 加载动画 */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: #fff;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }
    
    .typing-dot {
      width: 8px;
      height: 8px;
      background: #86868b;
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }
    
    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    
    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }
    
    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      30% {
        transform: translateY(-8px);
        opacity: 1;
      }
    }
    
    /* 隐藏元素 */
    .hidden {
      display: none !important;
    }
    
    /* 滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #d2d2d7;
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #86868b;
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <span>智能客服系统</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="clearChat()">清空对话</button>
      <button class="btn btn-primary" onclick="newChat()">+ 新建对话</button>
    </div>
  </header>
  
  <!-- 主内容区 -->
  <div class="main">
    <!-- 左侧面板 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" onclick="newChat()">
          <span>💬</span>
          <span>新建对话</span>
        </button>
      </div>
      <div class="chat-list" id="chatList">
        <!-- 对话列表 -->
      </div>
    </aside>
    
    <!-- 聊天区 -->
    <main class="chat-area">
      <!-- 欢迎界面 -->
      <div class="welcome" id="welcomeScreen">
        <div class="welcome-icon">🤖</div>
        <h1 class="welcome-title">您好，我是智能客服助手</h1>
        <p class="welcome-subtitle">我可以帮您解答常见问题、处理订单查询、以及转接人工客服。</p>
        <div class="quick-actions">
          <div class="quick-action" onclick="sendQuickMessage('我的订单什么时候发货？')">📦 订单查询</div>
          <div class="quick-action" onclick="sendQuickMessage('我想申请退款')">💰 退款申请</div>
          <div class="quick-action" onclick="sendQuickMessage('物流信息显示异常')">🚚 物流问题</div>
          <div class="quick-action" onclick="sendQuickMessage('我要投诉')">⚠️ 我要投诉</div>
          <div class="quick-action" onclick="sendQuickMessage('你们的营业时间是什么？')">🕐 营业时间</div>
          <div class="quick-action" onclick="sendQuickMessage('怎么联系客服？')">📞 联系客服</div>
        </div>
      </div>
      
      <!-- 聊天界面（初始隐藏） -->
      <div class="chat-header hidden" id="chatHeader">
        <div class="chat-title">智能客服</div>
        <div class="chat-status">
          <span class="status-dot"></span>
          <span>在线</span>
        </div>
      </div>
      
      <div class="chat-messages hidden" id="chatMessages">
        <!-- 消息会动态添加 -->
      </div>
      
      <div class="chat-input hidden" id="chatInput">
        <div class="input-wrapper">
          <div class="input-box">
            <textarea 
              id="messageInput" 
              placeholder="输入您的问题..."
              rows="1"
              onkeydown="handleKeyDown(event)"
              oninput="autoResize(this)"
            ></textarea>
          </div>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </main>
    
    <!-- 右侧面板 -->
    <aside class="info-panel hidden" id="infoPanel">
      <div class="panel-section">
        <div class="panel-title">对话统计</div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="msgCount">0</div>
            <div class="stat-label">消息数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="toolCount">0</div>
            <div class="stat-label">工具调用</div>
          </div>
        </div>
      </div>
      
      <div class="panel-section">
        <div class="panel-title">常见问题</div>
        <div class="faq-item" onclick="sendQuickMessage('我的订单什么时候发货？')">
          <div class="faq-question">📦 订单发货时间</div>
          <div class="faq-answer">付款后1-2个工作日内发货</div>
        </div>
        <div class="faq-item" onclick="sendQuickMessage('我想申请退款')">
          <div class="faq-question">💰 退款流程</div>
          <div class="faq-answer">确认收货后7天内可申请</div>
        </div>
        <div class="faq-item" onclick="sendQuickMessage('物流信息查询')">
          <div class="faq-question">🚚 物流查询</div>
          <div class="faq-answer">在订单详情页查看物流信息</div>
        </div>
        <div class="faq-item" onclick="sendQuickMessage('我要投诉')">
          <div class="faq-question">⚠️ 投诉建议</div>
          <div class="faq-answer">我们将尽快处理您的投诉</div>
        </div>
      </div>
    </aside>
  </div>
  
  <script>
    // 对话状态
    let conversations = [];
    let currentConversationId = null;
    let messageCount = 0;
    let toolCallCount = 0;
    
    // FAQ 知识库
    const faqDatabase = [
      {
        question: "我的订单什么时候发货？",
        answer: "您的订单将在付款后 <strong>1-2个工作日</strong>内发货。发货后您会在邮箱收到物流单号，可以在订单详情页查看物流信息。",
        keywords: ["订单", "发货", "物流", "快递"],
        category: "订单查询"
      },
      {
        question: "如何申请退款？",
        answer: "退款申请流程：<br>1. 进入「我的订单」<br>2. 找到对应订单，点击「申请退款」<br>3. 选择退款原因并填写说明<br>4. 提交申请<br><br>退款将在审核通过后 <strong>3-7个工作日</strong>原路返回。",
        keywords: ["退款", "退货", "取消订单"],
        category: "退款申请"
      },
      {
        question: "物流信息显示异常怎么办？",
        answer: "如果物流信息长时间未更新，可能是以下原因：<br>• 快递转运中，信息有延迟<br>• 节假日期间物流较慢<br><br>建议先等待 <strong>24小时</strong>，如仍无更新可联系人工客服处理。",
        keywords: ["物流", "异常", "未更新", " stuck"],
        category: "物流问题"
      },
      {
        question: "你们支持哪些支付方式？",
        answer: "我们支持以下支付方式：<br>• 微信支付<br>• 支付宝<br>• 银行卡（储蓄卡/信用卡）<br>• Apple Pay<br>• 花呗分期",
        keywords: ["支付", "付款", "微信", "支付宝", "银行卡"],
        category: "支付方式"
      },
      {
        question: "商品有质量问题怎么办？",
        answer: "如遇商品质量问题，请您：<br>1. 保留商品原包装<br>2. 拍摄问题照片/视频<br>3. 在订单页面申请「退换货」<br>4. 选择「质量问题」原因<br><br>我们支持 <strong>7天无理由退换</strong>，运费由我们承担。",
        keywords: ["质量", "问题", "瑕疵", "损坏", "退换"],
        category: "售后服务"
      },
      {
        question: "你们的营业时间是什么？",
        answer: "人工客服营业时间：<br>• 工作日：<strong>9:00 - 21:00</strong><br>• 周末：<strong>10:00 - 20:00</strong><br><br>智能客服 <strong>7×24小时</strong> 在线为您服务。",
        keywords: ["营业时间", "客服时间", "工作时间"],
        category: "客户服务"
      },
      {
        question: "如何修改收货地址？",
        answer: "修改收货地址：<br>• <strong>订单未发货</strong>：在订单详情页直接修改<br>• <strong>订单已发货</strong>：联系快递客服进行转寄<br><br>建议尽早修改，以免耽误收货。",
        keywords: ["地址", "收货地址", "修改地址", "换地址"],
        category: "订单修改"
      },
      {
        question: "你们发什么快递？",
        answer: "我们合作的主流快递公司：<br>• 顺丰快递（大部分订单）<br>• 京东物流<br>• 圆通快递<br>• 中通快递<br><br>具体快递公司由系统根据地址和商品自动分配。",
        keywords: ["快递", "顺丰", "物流", "发货"],
        category: "物流信息"
      }
    ];
    
    // 加载对话历史
    function loadConversations() {
      const saved = localStorage.getItem('cs_conversations');
      if (saved) {
        conversations = JSON.parse(saved);
        renderChatList();
      }
    }
    
    // 保存对话历史
    function saveConversations() {
      localStorage.setItem('cs_conversations', JSON.stringify(conversations));
    }
    
    // 渲染对话列表
    function renderChatList() {
      const list = document.getElementById('chatList');
      list.innerHTML = '';
      
      conversations.forEach(conv => {
        const item = document.createElement('div');
        item.className = `chat-item ${conv.id === currentConversationId ? 'active' : ''}`;
        item.onclick = () => switchConversation(conv.id);
        item.innerHTML = `
          <div class="chat-item-title">${conv.title}</div>
          <div class="chat-item-meta">${conv.messages.length} 条消息 · ${formatTime(conv.updatedAt)}</div>
        `;
        list.appendChild(item);
      });
    }
    
    // 切换对话
    function switchConversation(id) {
      currentConversationId = id;
      const conv = conversations.find(c => c.id === id);
      if (conv) {
        renderMessages(conv);
        document.getElementById('welcomeScreen').classList.add('hidden');
        document.getElementById('chatHeader').classList.remove('hidden');
        document.getElementById('chatMessages').classList.remove('hidden');
        document.getElementById('chatInput').classList.remove('hidden');
        document.getElementById('infoPanel').classList.remove('hidden');
        updateStats(conv);
      }
      renderChatList();
    }
    
    // 渲染消息
    function renderMessages(conv) {
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';
      
      conv.messages.forEach(msg => {
        appendMessage(msg, false);
      });
      
      scrollToBottom();
    }
    
    // 添加消息
    function appendMessage(msg, animate = true) {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = `message ${msg.role}`;
      
      const avatar = msg.role === 'assistant' ? '🤖' : '👤';
      
      let toolsHtml = '';
      if (msg.tools && msg.tools.length > 0) {
        toolsHtml = '<div class="message-tools">';
        msg.tools.forEach(tool => {
          toolsHtml += `<span class="tool-call">🔧 ${tool}</span>`;
        });
        toolsHtml += '</div>';
      }
      
      div.innerHTML = `
        <div class="message-avatar">${avatar}</div>
        <div>
          <div class="message-content">${msg.content}</div>
          ${toolsHtml}
        </div>
      `;
      
      if (animate) {
        container.appendChild(div);
        scrollToBottom();
      } else {
        container.appendChild(div);
      }
    }
    
    // 发送快速消息
    function sendQuickMessage(text) {
      document.getElementById('messageInput').value = text;
      sendMessage();
    }
    
    // 发送消息
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      
      if (!text) return;
      
      // 显示聊天界面
      document.getElementById('welcomeScreen').classList.add('hidden');
      document.getElementById('chatHeader').classList.remove('hidden');
      document.getElementById('chatMessages').classList.remove('hidden');
      document.getElementById('chatInput').classList.remove('hidden');
      document.getElementById('infoPanel').classList.remove('hidden');
      
      // 获取或创建对话
      let conv = conversations.find(c => c.id === currentConversationId);
      if (!conv) {
        conv = {
          id: Date.now().toString(),
          title: text.substring(0, 20) + (text.length > 20 ? '...' : ''),
          messages: [],
          createdAt: Date.now(),
          updatedAt: Date.now()
        };
        conversations.unshift(conv);
      }
      
      // 添加用户消息
      const userMsg = {
        role: 'user',
        content: text,
        timestamp: Date.now(),
        tools: []
      };
      conv.messages.push(userMsg);
      appendMessage(userMsg);
      messageCount++;
      
      input.value = '';
      input.style.height = 'auto';
      
      // 显示加载状态
      showTypingIndicator();
      
      // 模拟AI响应
      setTimeout(() => {
        removeTypingIndicator();
        const response = generateResponse(text);
        conv.messages.push(response);
        appendMessage(response);
        conv.updatedAt = Date.now();
        saveConversations();
        renderChatList();
        updateStats(conv);
      }, 1000 + Math.random() * 1000);
    }
    
    // 生成响应（模拟FAQ检索）
    function generateResponse(question) {
      const tools = [];
      let foundFAQ = null;
      
      // 检索FAQ
      faqDatabase.forEach(faq => {
        const similarity = calculateSimilarity(question, faq);
        if (similarity > 0.3) {
          foundFAQ = { ...faq, similarity };
        }
      });
      
      // 检测意图
      const intent = detectIntent(question);
      tools.push('faq_retriever');
      tools.push('conversation_manager');
      
      if (intent === 'escalation') {
        tools.push('escalation_manager');
      }
      
      // 生成回复
      let content = '';
      
      if (foundFAQ && foundFAQ.similarity > 0.6) {
        content = `根据您的咨询，我为您找到以下信息：<br><br>${foundFAQ.answer}<br><br><em>（相似度：${(foundFAQ.similarity * 100).toFixed(0)}%）</em>`;
      } else if (intent === 'complaint') {
        content = '我理解您的心情，这个问题需要特殊处理。让我为您转接<strong>人工客服</strong>，他们会尽快为您解决。';
      } else if (intent === 'escalation') {
        content = '好的，我已经为您创建了<strong>加急工单</strong>，人工客服会在<strong>30分钟内</strong>联系您。请问还有其他方式可以帮您吗？';
      } else {
        content = '抱歉，我没有找到完全匹配的信息。您可以：<br>• 重新描述您的问题<br>• 或者我为您转接人工客服';
      }
      
      return {
        role: 'assistant',
        content,
        timestamp: Date.now(),
        tools
      };
    }
    
    // 计算相似度
    function calculateSimilarity(question, faq) {
      const words1 = new Set(question.toLowerCase().split(/[\s,，。！？、]+/));
      const words2 = new Set(faq.question.toLowerCase().split(/[\s,，。！？、]+/));
      const intersection = new Set([...words1].filter(x => words2.has(x)));
      return intersection.size / Math.max(words1.size, words2.size, 1);
    }
    
    // 检测意图
    function detectIntent(text) {
      text = text.toLowerCase();
      
      if (text.includes('投诉') || text.includes('差评') || text.includes('不满意')) {
        return 'complaint';
      }
      if (text.includes('退款') || text.includes('退货')) {
        return 'refund';
      }
      if (text.includes('人工') || text.includes('客服')) {
        return 'escalation';
      }
      if (text.includes('谢谢') || text.includes('感谢')) {
        return 'gratitude';
      }
      if (text.includes('怎么') || text.includes('如何') || text.includes('请问')) {
        return 'inquiry';
      }
      
      return 'general';
    }
    
    // 显示加载动画
    function showTypingIndicator() {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'message assistant';
      div.id = 'typingIndicator';
      div.innerHTML = `
        <div class="message-avatar">🤖</div>
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      container.appendChild(div);
      scrollToBottom();
      document.getElementById('sendBtn').disabled = true;
    }
    
    // 移除加载动画
    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) {
        indicator.remove();
      }
      document.getElementById('sendBtn').disabled = false;
    }
    
    // 更新统计
    function updateStats(conv) {
      document.getElementById('msgCount').textContent = conv.messages.length;
      document.getElementById('toolCount').textContent = toolCallCount;
    }
    
    // 新建对话
    function newChat() {
      currentConversationId = null;
      messageCount = 0;
      toolCallCount = 0;
      
      document.getElementById('chatMessages').innerHTML = '';
      document.getElementById('chatMessages').classList.add('hidden');
      document.getElementById('chatHeader').classList.add('hidden');
      document.getElementById('chatInput').classList.add('hidden');
      document.getElementById('infoPanel').classList.add('hidden');
      document.getElementById('welcomeScreen').classList.remove('hidden');
      
      renderChatList();
      document.getElementById('msgCount').textContent = '0';
      document.getElementById('toolCount').textContent = '0';
    }
    
    // 清空对话
    function clearChat() {
      if (!currentConversationId) return;
      
      if (confirm('确定要清空当前对话吗？')) {
        conversations = conversations.filter(c => c.id !== currentConversationId);
        currentConversationId = null;
        saveConversations();
        newChat();
      }
    }
    
    // 处理键盘事件
    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }
    
    // 自动调整输入框高度
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }
    
    // 格式化时间
    function formatTime(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const diff = now - date;
      
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
      return date.toLocaleDateString('zh-CN');
    }
    
    // 滚动到底部
    function scrollToBottom() {
      const container = document.getElementById('chatMessages');
      container.scrollTop = container.scrollHeight;
    }
    
    // 初始化
    loadConversations();
  </script>
</body>
</html>
