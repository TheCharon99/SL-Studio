    ];

    // Fisher-Yates 洗牌算法
    // 随机选择3个项目，每类一个
    function shuffle(array) {
        for (var i = array.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = array[i];
            array[i] = array[j];
            array[j] = temp;
        }
        return array;
    }

    // 按分类筛选
    var villaProjects = allProjects.filter(function(p) { return p.category === '别墅豪宅'; });
    var aptProjects = allProjects.filter(function(p) { return p.category === '私宅公寓'; });
    var commercialProjects = allProjects.filter(function(p) { return p.category === '商业空间'; });

    // 每个分类随机选一个
    shuffle(villaProjects);
    shuffle(aptProjects);
    shuffle(commercialProjects);
    var selected = [villaProjects[0], aptProjects[0], commercialProjects[0]];
    
    var container = document.getElementById('random-projects');
    if (container) {
        container.innerHTML = '';
        selected.forEach(function(project) {
            var li = document.createElement('li');
            li.style.textAlign = 'center';
            li.innerHTML = '<div class="projects-thumb">' +
                '<div class="recent-project-details">' +
                '<a href="project-detail.html?project=' + encodeURIComponent(project.name) + '">' +

                '</a>' +
                '<h5>' + project.name + '</h5>' +
                '</div>' +
                '</div>';
            container.appendChild(li);
        });
    }
})();
