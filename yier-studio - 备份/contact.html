<div id="f_left">
    <!-- 表单提交到 Formspree：把下面 action 里的 YOUR_FORM_ID 换成你在 formspree.io 注册后拿到的地址 -->
    <form class="contact-form" method="POST" action="https://formspree.io/f/YOUR_FORM_ID">

        <input type="text" name="_gotcha" style="display:none">
        <div class="field">
            <label for="cntctfrm_contact_name">姓名</label>
            <input type="text" id="cntctfrm_contact_name" name="name" required>
        </div>
        <div class="field">
            <label for="cntctfrm_contact_email">邮件</label>
            <input type="email" id="cntctfrm_contact_email" name="email" required>
        </div>
        <div class="field">
            <label for="cntctfrm_contact_subject">标题</label>
            <input type="text" id="cntctfrm_contact_subject" name="subject" required>
        </div>
        <div class="field">
            <label for="cntctfrm_contact_message">信息</label>
            <textarea id="cntctfrm_contact_message" name="message" required></textarea>
        </div>
        <button type="submit" class="submit-btn">提交</button>
        <p class="form-note">提交后信息将直接发送到懿贰设计邮箱，我们会尽快与您联系。</p>
    </form>
