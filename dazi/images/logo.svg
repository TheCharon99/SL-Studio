<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)"/>
  
  <!-- 两个人形图标 -->
  <!-- 左边的人 -->
  <circle cx="70" cy="80" r="15" fill="white" opacity="0.9"/>
  <path d="M50 120 Q50 100 70 100 Q90 100 90 120 L90 140 L50 140 Z" fill="white" opacity="0.9"/>
  
  <!-- 右边的人 -->
  <circle cx="130" cy="80" r="15" fill="white" opacity="0.9"/>
  <path d="M110 120 Q110 100 130 100 Q150 100 150 120 L150 140 L110 140 Z" fill="white" opacity="0.9"/>
  
  <!-- 中间的连接弧线 -->
  <path d="M80 110 Q100 130 120 110" stroke="white" stroke-width="3" fill="none" opacity="0.6"/>
</svg>
