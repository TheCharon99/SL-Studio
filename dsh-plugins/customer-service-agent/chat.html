<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能客服 - 对话界面</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      background: #fff;
      padding: 16px 24px;
      border-bottom: 1px solid #e5e5e7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 20px; font-weight: 600; }
    .lang-switch {
      display: flex;
      gap: 8px;
    }
    .lang-btn {
      padding: 6px 12px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .lang-btn.active {
      background: #0071e3;
      color: #fff;
      border-color: #0071e3;
    }
    
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f5f5f7;
    }
    
    .chat-header {
      background: #fff;
      padding: 16px 24px;
      border-bottom: 1px solid #e5e5e7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-title { font-size: 16px; font-weight: 600; }
    .chat-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #34c759; }
    .status-dot { width: 8px; height: 8px; background: #34c759; border-radius: 50%; }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .message {
      max-width: 75%;
      display: flex;
      gap: 12px;
    }
    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .message.assistant .message-avatar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .message.user .message-avatar { background: #0071e3; color: #fff; }
    
    .message-content {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
    }
    .message.assistant .message-content {
      background: #fff;
      color: #1d1d1f;
      border-bottom-left-radius: 4px;
    }
    .message.user .message-content {
      background: #0071e3;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: #fff;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }
    .typing-dot {
      width: 8px;
      height: 8px;
      background: #86868b;
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-8px); opacity: 1; }
    }
    
    .chat-input {
      background: #fff;
      padding: 16px 24px;
      border-top: 1px solid #e5e5e7;
    }
    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    .input-box {
      flex: 1;
      background: #f5f5f7;
      border-radius: 12px;
      padding: 12px 16px;
      max-height: 120px;
      overflow-y: auto;
    }
    .input-box textarea {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
      font-family: inherit;
    }
    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #0071e3;
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: background 0.2s;
    }
    .send-btn:hover { background: #0077ed; }
    .send-btn:disabled { background: #d2d2d7; cursor: not-allowed; }
    
    /* 快捷回复 */
    .quick-replies {
      background: #fff;
      padding: 12px 24px;
      border-top: 1px solid #e5e5e7;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .quick-reply {
      padding: 8px 16px;
      background: #f5f5f7;
      border: 1px solid #e5e5e7;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-reply:hover {
      background: #0071e3;
      color: #fff;
      border-color: #0071e3;
    }
    
    .hidden { display: none !important; }
    
    /* 欢迎界面 */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }
    .welcome-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 24px;
    }
    .welcome-title { font-size: 28px; font-weight: 600; color: #1d1d1f; margin-bottom: 12px; }
    .welcome-subtitle { font-size: 16px; color: #86868b; margin-bottom: 32px; max-width: 400px; }
    
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 500px;
      width: 100%;
    }
    .quick-action {
      padding: 16px;
      background: #fff;
      border: 1px solid #e5e5e7;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }
    .quick-action:hover {
      background: #f5f5f7;
      border-color: #0071e3;
      transform: translateY(-2px);
    }
    .quick-action-icon { font-size: 24px; margin-bottom: 8px; }
    .quick-action-title { font-size: 14px; font-weight: 600; color: #1d1d1f; }
    .quick-action-desc { font-size: 12px; color: #86868b; margin-top: 4px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">🤖 AI 智能客服</div>
    <div class="lang-switch">
      <button class="lang-btn active" onclick="switchLang('zh')">中文</button>
      <button class="lang-btn" onclick="switchLang('en')">English</button>
    </div>
  </header>
  
  <div class="main">
    <div class="chat-area">
      <!-- 欢迎界面 -->
      <div class="welcome" id="welcome-screen">
        <div class="welcome-icon">🤖</div>
        <h1 class="welcome-title" data-i18n="welcome_title">您好，我是智能客服助手</h1>
        <p class="welcome-subtitle" data-i18n="welcome_subtitle">我可以帮您解答常见问题、处理订单查询，以及转接人工客服</p>
        
        <div class="quick-actions">
          <div class="quick-action" onclick="sendQuickMessage('order')">
            <div class="quick-action-icon">📦</div>
            <div class="quick-action-title" data-i18n="qa_order">订单查询</div>
            <div class="quick-action-desc" data-i18n="qa_order_desc">查看订单状态和物流信息</div>
          </div>
          <div class="quick-action" onclick="sendQuickMessage('refund')">
            <div class="quick-action-icon">💰</div>
            <div class="quick-action-title" data-i18n="qa_refund">退款申请</div>
            <div class="quick-action-desc" data-i18n="qa_refund_desc">了解退款流程和时效</div>
          </div>
          <div class="quick-action" onclick="sendQuickMessage('logistics')">
            <div class="quick-action-icon">🚚</div>
            <div class="quick-action-title" data-i18n="qa_logistics">物流问题</div>
            <div class="quick-action-desc" data-i18n="qa_logistics_desc">查询物流状态和异常</div>
          </div>
          <div class="quick-action" onclick="sendQuickMessage('complaint')">
            <div class="quick-action-icon">⚠️</div>
            <div class="quick-action-title" data-i18n="qa_complaint">我要投诉</div>
            <div class="quick-action-desc" data-i18n="qa_complaint_desc">快速转接人工客服</div>
          </div>
        </div>
      </div>
      
      <!-- 聊天界面 -->
      <div class="chat-header hidden" id="chat-header">
        <div class="chat-title" data-i18n="chat_title">智能客服</div>
        <div class="chat-status">
          <span class="status-dot"></span>
          <span data-i18n="online">在线</span>
        </div>
      </div>
      
      <div class="chat-messages hidden" id="chat-messages"></div>
      
      <div class="quick-replies hidden" id="quick-replies">
        <button class="quick-reply" onclick="sendQuickMessage('order')">📦 订单查询</button>
        <button class="quick-reply" onclick="sendQuickMessage('refund')">💰 退款申请</button>
        <button class="quick-reply" onclick="sendQuickMessage('logistics')">🚚 物流问题</button>
        <button class="quick-reply" onclick="sendQuickMessage('human')">👤 转人工</button>
      </div>
      
      <div class="chat-input hidden" id="chat-input">
        <div class="input-wrapper">
          <div class="input-box">
            <textarea id="message-input" placeholder="输入您的问题..." rows="1"
              onkeydown="handleKeyDown(event)"
              oninput="autoResize(this)"></textarea>
          </div>
          <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // 多语言配置
    const i18n = {
      zh: {
        welcome_title: '您好，我是智能客服助手',
        welcome_subtitle: '我可以帮您解答常见问题、处理订单查询，以及转接人工客服',
        chat_title: '智能客服',
        online: '在线',
        placeholder: '输入您的问题...',
        qa_order: '订单查询',
        qa_order_desc: '查看订单状态和物流信息',
        qa_refund: '退款申请',
        qa_refund_desc: '了解退款流程和时效',
        qa_logistics: '物流问题',
        qa_logistics_desc: '查询物流状态和异常',
        qa_complaint: '我要投诉',
        qa_complaint_desc: '快速转接人工客服'
      },
      en: {
        welcome_title: 'Hello, I\'m Your AI Assistant',
        welcome_subtitle: 'I can help you with common questions, order inquiries, and connect you with human support',
        chat_title: 'AI Support',
        online: 'Online',
        placeholder: 'Type your question...',
        qa_order: 'Order Status',
        qa_order_desc: 'Check order and shipping status',
        qa_refund: 'Refund',
        qa_refund_desc: 'Learn about refund process',
        qa_logistics: 'Shipping',
        qa_logistics_desc: 'Track your package',
        qa_complaint: 'Complaint',
        qa_complaint_desc: 'Connect to human support'
      }
    };
    
    let currentLang = 'zh';
    let conversations = JSON.parse(localStorage.getItem('cs_conversations') || '[]');
    let faqs = JSON.parse(localStorage.getItem('cs_faqs') || '[]');
    let currentConvId = null;
    
    // FAQ 数据（默认）
    const defaultFAQs = [
      { question: '我的订单什么时候发货？', answer: '您的订单将在付款后 1-2 个工作日内发货。发货后您会在邮箱收到物流单号，可以在订单详情页查看物流信息。', keywords: ['订单', '发货', '物流', '快递'], category: '订单查询' },
      { question: '如何申请退款？', answer: '退款申请流程：1. 进入「我的订单」 2. 找到对应订单，点击「申请退款」 3. 选择退款原因并填写说明 4. 提交申请。退款将在审核通过后 3-7 个工作日原路返回。', keywords: ['退款', '退货', '取消订单'], category: '退款申请' },
      { question: '物流信息显示异常怎么办？', answer: '如果物流信息长时间未更新，可能是以下原因：快递转运中信息有延迟，或节假日期间物流较慢。建议先等待 24 小时，如仍无更新可联系人工客服处理。', keywords: ['物流', '异常', '未更新'], category: '物流问题' },
      { question: '你们支持哪些支付方式？', answer: '我们支持：微信支付、支付宝、银行卡（储蓄卡/信用卡）、Apple Pay、花呗分期。', keywords: ['支付', '付款', '微信', '支付宝'], category: '支付方式' },
      { question: '商品有质量问题怎么办？', answer: '如遇商品质量问题，请您：1. 保留商品原包装 2. 拍摄问题照片/视频 3. 在订单页面申请「退换货」 4. 选择「质量问题」原因。我们支持 7 天无理由退换，运费由我们承担。', keywords: ['质量', '问题', '瑕疵', '损坏'], category: '售后服务' },
      { question: '你们的营业时间是什么？', answer: '人工客服营业时间：工作日 9:00-21:00，周末 10:00-20:00。智能客服 7×24 小时在线为您服务。', keywords: ['营业时间', '客服时间', '工作时间'], category: '客户服务' },
      { question: '如何修改收货地址？', answer: '修改收货地址：订单未发货可在订单详情页直接修改；订单已发货需联系快递客服进行转寄。建议尽早修改，以免耽误收货。', keywords: ['地址', '收货地址', '修改地址'], category: '订单修改' },
      { question: '你们发什么快递？', answer: '我们合作的主流快递公司：顺丰快递（大部分订单）、京东物流、圆通快递、中通快递。具体快递公司由系统根据地址和商品自动分配。', keywords: ['快递', '顺丰', '物流', '发货'], category: '物流信息' }
    ];
    
    // 初始化
    if (faqs.length === 0) {
      faqs = defaultFAQs;
      localStorage.setItem('cs_faqs', JSON.stringify(faqs));
    }
    
    // 切换语言
    function switchLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key]) {
          el.textContent = i18n[lang][key];
        }
      });
      
      document.getElementById('message-input').placeholder = i18n[lang].placeholder;
    }
    
    // 发送快捷消息
    function sendQuickMessage(type) {
      const messages = {
        order: currentLang === 'zh' ? '我的订单什么时候发货？' : 'When will my order ship?',
        refund: currentLang === 'zh' ? '我想申请退款' : 'I want to request a refund',
        logistics: currentLang === 'zh' ? '物流信息显示异常' : 'Logistics information is abnormal',
        complaint: currentLang === 'zh' ? '我要投诉' : 'I want to file a complaint',
        human: currentLang === 'zh' ? '转人工客服' : 'Connect to human support'
      };
      
      document.getElementById('message-input').value = messages[type];
      sendMessage();
    }
    
    // 发送消息
    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      
      if (!text) return;
      
      // 显示聊天界面
      document.getElementById('welcome-screen').classList.add('hidden');
      document.getElementById('chat-header').classList.remove('hidden');
      document.getElementById('chat-messages').classList.remove('hidden');
      document.getElementById('chat-input').classList.remove('hidden');
      document.getElementById('quick-replies').classList.remove('hidden');
      
      // 获取或创建对话
      let conv = conversations.find(c => c.id === currentConvId);
      if (!conv) {
        conv = {
          id: 'conv_' + Date.now(),
          userId: 'user_' + Date.now(),
          title: text.substring(0, 20),
          messages: [],
          createdAt: Date.now(),
          updatedAt: Date.now(),
          status: 'pending'
        };
        conversations.unshift(conv);
        currentConvId = conv.id;
      }
      
      // 添加用户消息
      appendMessage('user', text);
      conv.messages.push({ role: 'user', content: text, timestamp: Date.now() });
      
      input.value = '';
      input.style.height = 'auto';
      
      // 显示加载状态
      showTyping();
      
      // 生成回复（使用 Agnes API 或本地 FAQ）
      setTimeout(() => {
        removeTyping();
        const reply = generateReply(text);
        appendMessage('assistant', reply);
        conv.messages.push({ role: 'assistant', content: reply, timestamp: Date.now() });
        conv.updatedAt = Date.now();
        conv.lastReply = reply.substring(0, 50) + '...';
        
        // 保存到 localStorage
        localStorage.setItem('cs_conversations', JSON.stringify(conversations));
      }, 800 + Math.random() * 700);
    }
    
    // 生成回复
    function generateReply(question) {
      // 查找最匹配的 FAQ
      let bestMatch = null;
      let bestScore = 0;
      
      faqs.forEach(faq => {
        const score = calculateSimilarity(question, faq);
        if (score > bestScore && score > 0.4) {
          bestScore = score;
          bestMatch = faq;
        }
      });
      
      // 检测是否需要转人工
      if (question.includes('投诉') || question.includes('差评') || question.includes('不满意')) {
        return currentLang === 'zh' 
          ? '我理解您的心情，这个问题需要特殊处理。让我为您转接<strong>人工客服</strong>，他们会尽快为您解决。'
          : 'I understand your frustration. Let me connect you with a <strong>human agent</strong> who can help resolve this issue.';
      }
      
      if (question.includes('人工') || question.includes('客服')) {
        return currentLang === 'zh'
          ? '好的，我已经为您创建了<strong>加急工单</strong>，人工客服会在 <strong>30分钟内</strong> 联系您。'
          : 'Okay, I\'ve created an <strong>urgent ticket</strong>. A human agent will contact you within <strong>30 minutes</strong>.';
      }
      
      // 返回 FAQ 答案
      if (bestMatch) {
        return currentLang === 'zh'
          ? `根据您的咨询，我为您找到以下信息：<br><br>${bestMatch.answer}<br><br><em>（相似度：${(bestScore * 100).toFixed(0)}%）</em>`
          : `Based on your inquiry, here's the information:<br><br>${bestMatch.answer}<br><br><em>(Similarity: ${(bestScore * 100).toFixed(0)}%)</em>`;
      }
      
      // 默认回复
      return currentLang === 'zh'
        ? '抱歉，我没有找到完全匹配的信息。您可以：<br>• 重新描述您的问题<br>• 或者我为您转接人工客服'
        : 'Sorry, I couldn\'t find an exact match. You can:<br>• Rephrase your question<br>• Or I can connect you to a human agent';
    }
    
    // 计算相似度
    function calculateSimilarity(q1, q2) {
      const words1 = new Set(q1.toLowerCase().split(/[\s,，。！？、]+/));
      const words2 = new Set(q2.toLowerCase().split(/[\s,，。！？、]+/));
      const intersection = new Set([...words1].filter(x => words2.has(x)));
      return intersection.size / Math.max(words1.size, words2.size, 1);
    }
    
    // 添加消息
    function appendMessage(role, content) {
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      
      const avatar = role === 'assistant' ? '🤖' : '👤';
      
      div.innerHTML = `
        <div class="message-avatar">${avatar}</div>
        <div class="message-content">${content}</div>
      `;
      
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }
    
    // 显示加载动画
    function showTyping() {
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = 'message assistant';
      div.id = 'typing-indicator';
      div.innerHTML = `
        <div class="message-avatar">🤖</div>
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      document.getElementById('send-btn').disabled = true;
    }
    
    // 移除加载动画
    function removeTyping() {
      const indicator = document.getElementById('typing-indicator');
      if (indicator) indicator.remove();
      document.getElementById('send-btn').disabled = false;
    }
    
    // 键盘事件
    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }
    
    // 自动调整输入框
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }
    
    // 初始化
    document.getElementById('message-input').placeholder = i18n[currentLang].placeholder;
  </script>
</body>
</html>
